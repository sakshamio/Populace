<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Populace</title>
<style>
  :root{
    --void:#0B0E14; --ink:#E6E9EF; --muted:#8992A3; --line:#232A38;
    --accent:#3B5DC9; --warn:#D9773C;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--void);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{
    display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
    padding:12px 16px;border-bottom:2px solid var(--line);
  }
  h1{font-size:14px;letter-spacing:.18em;text-transform:uppercase;margin:0}
  .sub{font-size:11px;color:var(--muted);letter-spacing:.06em}
  main{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  .bar{
    position:absolute;left:0;right:0;bottom:0;display:flex;gap:16px;
    flex-wrap:wrap;align-items:center;justify-content:space-between;
    padding:10px 16px;background:rgba(11,14,20,.85);border-top:2px solid var(--line);
  }
  .stats{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
  .stats b{color:var(--ink)}
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  button,select{
    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    font-weight:700;background:var(--accent);color:#fff;border:2px solid var(--accent);
    padding:6px 12px;cursor:pointer;
  }
  select{background:var(--void);color:var(--ink);border-color:var(--line)}
  button:hover{background:var(--ink);color:var(--void);border-color:var(--ink)}
  button:focus-visible,select:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
  .key{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);
    letter-spacing:.06em;text-transform:uppercase}
  .sw{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
  #err{
    position:absolute;inset:auto 16px 64px 16px;padding:12px 14px;
    border:2px solid var(--warn);background:#33251A;font-size:12px;
    line-height:1.5;display:none;text-transform:none;letter-spacing:0;
  }
</style>
</head>
<body>
<header>
  <h1>Populace</h1>
  <span class="sub" id="hdr">phase 3 — social graph, opinion dynamics, complex contagion</span>
</header>

<main>
  <canvas id="gl" aria-label="Rotating globe showing the simulated population"></canvas>
  <div id="err" role="alert"></div>
  <div class="bar">
    <div class="stats">
      <span>pop <b id="s-pop">—</b></span>
      <span>fps <b id="s-fps">—</b></span>
      <span>tick <b id="s-tick">0</b></span>
      <span>reach <b id="s-reach">0.00%</b></span>
      <span>split <b id="s-split">—</b></span>
      <span>ties <b id="s-edges">—</b></span>
      <span>load <b id="s-load">—</b></span>
    </div>
    <div class="controls">
      <label class="sub" for="n">size</label>
      <select id="n">
        <option value="250000">250k</option>
        <option value="1000000" selected>1M</option>
        <option value="4000000">4M</option>
        <option value="10000000">10M</option>
      </select>
      <button id="reload" type="button">Load</button>
      <button id="fire" type="button">Break a story</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>
</main>

<div class="bar" style="position:static;border-top:0;border-bottom:2px solid var(--line);background:transparent">
  <div class="key">
    <span><i class="sw" style="background:#4A5568"></i>hasn&rsquo;t heard</span>
    <span><i class="sw" style="background:#4C73DA"></i>against</span>
    <span><i class="sw" style="background:#E58A3E"></i>in favour</span>
    <span>brightness = carrying the story · dim = attention moved on</span>
    <span>weighted sample, not a headcount</span>
  </div>
</div>

<script type="module">
import { Globe } from './globe.js';

const $ = (id) => document.getElementById(id);
const err = $('err');
function fail(e) {
  err.style.display = 'block';
  err.textContent = String(e && e.message ? e.message : e);
  console.error(e);
}
const pct = (v) => (v * 100).toFixed(2) + '%';

let globe;
try {
  globe = new Globe($('gl'), ({ n, fps, tick }) => {
    $('s-pop').textContent = n.toLocaleString();
    $('s-fps').textContent = fps;
    $('s-tick').textContent = tick;
  });
  globe.start();
} catch (e) {
  fail(e);
}

async function load() {
  const n = $('n').value;
  $('s-load').textContent = 'fetching…';
  const t0 = performance.now();
  try {
    const res = await fetch(`/api/instances?n=${n}`);
    if (!res.ok) throw new Error(`server returned ${res.status} ${res.statusText}`);
    const buf = await res.arrayBuffer();
    const fetched = performance.now();
    globe.load(buf);
    const done = performance.now();
    $('s-load').textContent =
      `${(buf.byteLength / 1e6).toFixed(1)} MB · ${Math.round(fetched - t0)} ms net · ${Math.round(done - fetched)} ms upload`;
    err.style.display = 'none';
  } catch (e) {
    $('s-load').textContent = 'failed';
    fail(e);
  }
}

// State and statistics are polled separately and at different rates on
// purpose: the flags frame is the one that can be megabytes, and there is no
// reason to re-derive weighted aggregates over the whole population just to
// keep a number in a status bar moving.
let polling = false;
async function pollState() {
  if (polling || !globe || !globe.n) return;
  polling = true;
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    if (res.ok) globe.applyFrame(await res.arrayBuffer());
  } catch (e) { /* a dropped frame is not worth an error banner */ }
  polling = false;
}

async function pollStats() {
  try {
    const res = await fetch('/api/stats', { cache: 'no-store' });
    if (!res.ok) return;
    const { snapshot: s, running } = await res.json();
    $('s-reach').textContent = pct(s.reach);
    $('s-split').textContent =
      `${pct(s.share_against)} / ${pct(s.share_for)}`;
    $('s-edges').textContent = s.edges.toLocaleString();
    $('pause').textContent = running ? 'Pause' : 'Resume';
  } catch (e) { /* same */ }
}

const HEADLINES = [
  ['Regulator opens inquiry into the largest carrier', -0.8],
  ['Central bank holds rates for a fourth quarter', -0.2],
  ['Coastal cities agree a joint flood-defence fund', 0.6],
  ['Leaked memo contradicts the official account', -0.9],
  ['Trial results published for the new treatment', 0.8],
];

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  });
  return res.ok ? res.json() : null;
}

$('reload').addEventListener('click', load);
$('reset').addEventListener('click', async () => {
  await post('/api/control', { reset: true });
  pollStats();
});
$('pause').addEventListener('click', async () => {
  const running = $('pause').textContent === 'Pause';
  await post('/api/control', { running: !running });
  pollStats();
});
$('fire').addEventListener('click', async () => {
  const [headline, stance] = HEADLINES[(Math.random() * HEADLINES.length) | 0];
  $('hdr').textContent = headline;
  // Seeded in a region rather than scattered worldwide: a complex contagion
  // started by scattering the same number of seeds does not start at all --
  // nobody gets the second exposure the threshold rule requires.
  //
  // The seed is a *fraction* of the population, not a fixed count, because
  // that is what reach actually tracks: seeding 1% reaches ~1.4% at sixty
  // thousand and at one million alike. A fixed 300 people would be a story at
  // small scale and a rounding error at large.
  const seed_size = Math.max(400, Math.round(globe.n / 100));
  await post('/api/event', { headline, stance, salience: 0.7, seeding: 'region', seed_size });
  pollStats();
});

setInterval(pollState, 400);
setInterval(pollStats, 1000);
load();
</script>
</body>
</html>
